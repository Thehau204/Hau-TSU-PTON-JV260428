<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Modal Example</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <button id="openBtn">Open Modal</button>

  <div id="overlay">
    <div id="modal">
      <span id="closeBtn">×</span>
      <p>Some text in the Modal</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
