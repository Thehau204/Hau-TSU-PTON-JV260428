<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>Todo App</h2>

    <div class="input-box">
      <input id="todoInput" type="text" placeholder="Add your new todo">
      <button id="addBtn">+</button>
    </div>

    <ul id="todoList"></ul>

    <div class="footer">
      <span id="count"></span>
      <button id="clearAll">Clear All</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
